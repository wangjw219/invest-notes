<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>投资知识库 · 保存</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    body { max-width: 640px; margin: 0 auto; padding: 16px; font: 15px/1.7 system-ui, sans-serif; }
    .hidden { display: none; }
    input, textarea, button, select { font: inherit; box-sizing: border-box; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
    .card h4 { margin: 0 0 8px; }
    .meta { color: #80868b; font-size: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    a { color: #1a73e8; }
    #toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #202124; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div class="row">
    <h3>投资知识库</h3>
    <a href="list.html" id="toList" class="hidden">收藏列表 →</a>
  </div>

  <!-- 登录 -->
  <section id="auth" class="card">
    <h4>登录</h4>
    <input id="email" type="email" placeholder="邮箱" autocomplete="email" />
    <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
    <input id="sbUrl" placeholder="Supabase URL（如 https://xxx.supabase.co）" />
    <input id="sbAnon" placeholder="anon public key" />
    <button id="loginBtn">登录 / 注册</button>
    <p class="meta">Supabase URL 和 anon key 在 Dashboard → Connect → Framework 里。</p>
  </section>

  <!-- 保存：主页 -->
  <section id="main" class="hidden">
    <div class="card">
      <h4>💭 我的想法</h4>
      <textarea id="newIdea" rows="4" placeholder="此刻的想法、判断、疑问…"></textarea>
      <button id="addIdea">保存想法</button>
    </div>

    <div class="card">
      <h4>📰 其他人的观点</h4>
      <input id="vpUrl" placeholder="链接（可选）" />
      <input id="vpAuthor" placeholder="作者 / 来源（可选）" />
      <textarea id="vpContent" rows="5" placeholder="粘贴原文、摘录，或转述你看到的观点…"></textarea>
      <button id="addVp">保存观点</button>
    </div>

    <p class="meta">电脑网页上还可以用 Chrome 插件一键保存；手机上用系统「分享」直接发到本页。</p>
  </section>

  <div id="toast"></div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const $ = (id) => document.getElementById(id);
    const cfg = {
      url: localStorage.getItem("sb_url") ?? "",
      anon: localStorage.getItem("sb_anon") ?? "",
    };
    $("sbUrl").value = cfg.url;
    $("sbAnon").value = cfg.anon;

    let sb = null;
    if (cfg.url && cfg.anon) sb = createClient(cfg.url, cfg.anon);

    const toast = (text) => {
      const el = $("toast");
      el.textContent = text;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2500);
    };

    function showMain() {
      $("auth").classList.add("hidden");
      $("main").classList.remove("hidden");
      $("toList").classList.remove("hidden");
    }

    $("loginBtn").addEventListener("click", async () => {
      const btn = $("loginBtn");
      btn.disabled = true; btn.textContent = "登录中…";
      try {
        localStorage.setItem("sb_url", $("sbUrl").value.trim());
        localStorage.setItem("sb_anon", $("sbAnon").value.trim());
        sb = createClient($("sbUrl").value.trim(), $("sbAnon").value.trim());
        const email = $("email").value.trim(), password = $("password").value;
        await sb.auth.signUp({ email, password }).catch(() => {});
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { alert(`登录失败：${error.message}`); }
        else { btn.textContent = "登录成功"; showMain(); return; }
      } catch (e) {
        alert(`出错了：${e.message ?? e}`);
      }
      btn.disabled = false; btn.textContent = "登录 / 注册";
    });
    window.addEventListener("unhandledrejection", (e) => alert(`出错了：${e.reason?.message ?? e.reason}`));

    async function insert(type, fields) {
      const { error } = await sb.from("items").insert({ type, ...fields });
      if (error) { alert(`保存失败：${error.message}`); return false; }
      return true;
    }

    $("addIdea").addEventListener("click", async () => {
      const text = $("newIdea").value.trim();
      if (!text) return;
      if (await insert("idea", { title: text.slice(0, 50), content: text })) {
        $("newIdea").value = "";
        toast("想法已保存 ✓");
      }
    });

    $("addVp").addEventListener("click", async () => {
      const content = $("vpContent").value.trim();
      if (!content) { alert("先填点内容"); return; }
      const url = $("vpUrl").value.trim();
      const author = $("vpAuthor").value.trim();
      if (await insert("viewpoint", {
        url: url || null,
        title: author ? `${author} 的观点` : content.slice(0, 50),
        content,
        author,
        source: url ? new URL(url).hostname : "",
      })) {
        $("vpUrl").value = ""; $("vpAuthor").value = ""; $("vpContent").value = "";
        toast("观点已保存 ✓");
      }
    });

    // 安卓「分享」入口：分享过来的内容存为「其他人的观点」
    const params = new URLSearchParams(location.search);
    if (params.get("title") || params.get("text") || params.get("url")) {
      history.replaceState(null, "", location.pathname);
      const url = params.get("url") ?? "";
      const text = params.get("text") ?? "";
      const title = params.get("title") ?? "";
      (async () => {
        const waitSession = async () => {
          for (let i = 0; i < 60; i++) {
            const { data: { session } } = await sb?.auth.getSession() ?? { data: { session: null } };
            if (session) return session;
            await new Promise((r) => setTimeout(r, 500));
          }
          return null;
        };
        if (!await waitSession()) {
          // 未登录：内容填进表单，登录后手动保存
          $("vpUrl").value = url;
          $("vpContent").value = [title, text].filter(Boolean).join("\n");
          alert("已接收分享内容，请先登录，然后点「保存观点」");
          return;
        }
        const { error } = await sb.from("items").insert({
          type: "viewpoint",
          url: url || null,
          title: title || text.slice(0, 50) || url || "分享的内容",
          content: text || title,
          source: url ? new URL(url).hostname : "",
        });
        if (error) alert(`保存分享内容失败：${error.message}`);
        else { toast("分享内容已保存 ✓"); }
      })();
    } else if (sb) {
      sb.auth.getSession().then(({ data: { session } }) => { if (session) showMain(); });
    }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
