<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2f4ef" />
  <title>投资知识库 · 保存</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1 class="wordmark">投资知识库</h1>
      <nav class="nav">
        <a href="list.html" id="toList" class="nav-link hidden">收藏列表</a>
      </nav>
    </header>

    <!-- 登录 -->
    <section id="auth" class="sheet auth-sheet">
      <h2 class="sheet-title">登录</h2>
      <label class="field">
        <span>邮箱</span>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" type="password" placeholder="输入密码" autocomplete="current-password" />
      </label>
      <button id="loginBtn" class="btn block">登录 / 注册</button>
    </section>

    <!-- 保存：主页 -->
    <section id="main" class="hidden">
      <div class="sheet">
        <h2 class="sheet-title">我的想法</h2>
        <textarea id="newIdea" class="prose" rows="4" placeholder="此刻的想法、判断、疑问…"></textarea>
        <div class="sheet-actions">
          <button id="addIdea" class="btn">保存想法</button>
        </div>
      </div>

      <div class="sheet">
        <h2 class="sheet-title">其他人的观点 <span class="hint">链接和原文至少填一个</span></h2>
        <label class="field">
          <span>作者 / 来源</span>
          <input id="vpAuthor" placeholder="可直接选择已用过的作者" list="authorList" autocomplete="off" />
        </label>
        <label class="field">
          <span>链接</span>
          <input id="vpUrl" placeholder="https://" />
        </label>
        <label class="field">
          <span>原文 / 摘录</span>
          <textarea id="vpContent" class="prose" rows="5" placeholder="粘贴原文、摘录，或转述你看到的观点…"></textarea>
        </label>
        <div class="sheet-actions">
          <button id="addVp" class="btn">保存观点</button>
          <button id="pasteClip" type="button" class="btn ghost">从剪贴板读取</button>
        </div>
      </div>

      <p class="footnote">电脑网页上还可以用 Chrome 插件一键保存；手机上用系统「分享」直接发到本页。</p>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <datalist id="authorList"></datalist>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const $ = (id) => document.getElementById(id);
    // 公开标识，写死在代码里（数据安全由数据库行级策略保证）
    const DEFAULT_URL = "https://oraddrhfysrqdflatgzn.supabase.co";
    const DEFAULT_ANON = "sb_publishable_Buf1sJtQUaTwLwNm-PWyTA_e0xCh21S";
    const cfg = {
      url: localStorage.getItem("sb_url") ?? DEFAULT_URL,
      anon: localStorage.getItem("sb_anon") ?? DEFAULT_ANON,
    };

    let sb = null;
    if (cfg.url && cfg.anon) sb = createClient(cfg.url, cfg.anon);

    const toast = (text) => {
      const el = $("toast");
      el.textContent = text;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2500);
    };

    function showMain() {
      $("auth").classList.add("hidden");
      $("main").classList.remove("hidden");
      $("toList").classList.remove("hidden");
      loadAuthorSuggestions();
    }

    // 已用过的作者/来源做成下拉建议（datalist），选择已有项或输入新值都可以
    async function loadAuthorSuggestions() {
      const { data } = await sb.from("items")
        .select("author, source")
        .order("created_at", { ascending: false })
        .limit(500);
      const values = [];
      const seen = new Set();
      for (const it of data ?? []) {
        for (const v of [it.author, it.source]) {
          const s = (v ?? "").trim();
          if (s && !seen.has(s)) { seen.add(s); values.push(s); }
        }
      }
      $("authorList").innerHTML = values
        .map((v) => `<option value="${v.replace(/&/g, "&amp;").replace(/"/g, "&quot;")}"></option>`)
        .join("");
    }

    $("loginBtn").addEventListener("click", async () => {
      const btn = $("loginBtn");
      btn.disabled = true; btn.textContent = "登录中…";
      try {
        sb = createClient(cfg.url, cfg.anon);
        const email = $("email").value.trim(), password = $("password").value;
        await sb.auth.signUp({ email, password }).catch(() => {});
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { alert(`登录失败：${error.message}`); }
        else { btn.textContent = "登录成功"; showMain(); return; }
      } catch (e) {
        alert(`出错了：${e.message ?? e}`);
      }
      btn.disabled = false; btn.textContent = "登录 / 注册";
    });
    window.addEventListener("unhandledrejection", (e) => alert(`出错了：${e.reason?.message ?? e.reason}`));

    async function insert(type, fields) {
      const { error } = await sb.from("items").insert({ type, ...fields });
      if (error) { alert(`保存失败：${error.message}`); return false; }
      return true;
    }

    $("addIdea").addEventListener("click", async () => {
      const text = $("newIdea").value.trim();
      if (!text) return;
      if (await insert("idea", { title: text.slice(0, 50), content: text })) {
        $("newIdea").value = "";
        toast("想法已保存 ✓");
      }
    });

    $("addVp").addEventListener("click", async () => {
      const content = $("vpContent").value.trim();
      const url = $("vpUrl").value.trim();
      const author = $("vpAuthor").value.trim();
      if (!content && !url) { alert("链接和原文必须填一个"); return; }
      if (await insert("viewpoint", {
        url: url || null,
        title: author ? `${author} 的观点` : (content ? content.slice(0, 50) : url),
        content,
        author,
        source: url ? new URL(url).hostname : "",
      })) {
        $("vpUrl").value = ""; $("vpAuthor").value = ""; $("vpContent").value = "";
        toast("观点已保存 ✓");
        loadAuthorSuggestions();
      }
    });

    // 从剪贴板读取链接/文字，快速预填（需用户点击触发，浏览器才会授权）
    $("pasteClip").addEventListener("click", async () => {
      try {
        const text = (await navigator.clipboard.readText()).trim();
        if (!text) { toast("剪贴板是空的"); return; }
        const urlMatch = text.match(/https?:\/\/\S+/);
        if (urlMatch && !$("vpUrl").value) $("vpUrl").value = urlMatch[0];
        if (!$("vpContent").value) $("vpContent").value = text.replace(urlMatch?.[0] ?? "", "").trim() || text;
        toast("已填入剪贴板内容");
      } catch {
        toast("读取剪贴板失败，请手动粘贴");
      }
    });

    // 安卓「分享」入口：分享过来的内容存为「其他人的观点」
    const params = new URLSearchParams(location.search);
    if (params.get("title") || params.get("text") || params.get("url")) {
      history.replaceState(null, "", location.pathname);
      const url = params.get("url") ?? "";
      const text = params.get("text") ?? "";
      const title = params.get("title") ?? "";
      (async () => {
        const waitSession = async () => {
          for (let i = 0; i < 60; i++) {
            const { data: { session } } = await sb?.auth.getSession() ?? { data: { session: null } };
            if (session) return session;
            await new Promise((r) => setTimeout(r, 500));
          }
          return null;
        };
        if (!await waitSession()) {
          // 未登录：内容填进表单，登录后手动保存
          $("vpUrl").value = url;
          $("vpContent").value = [title, text].filter(Boolean).join("\n");
          alert("已接收分享内容，请先登录，然后点「保存观点」");
          return;
        }
        const { error } = await sb.from("items").insert({
          type: "viewpoint",
          url: url || null,
          title: title || text.slice(0, 50) || url || "分享的内容",
          content: text || title,
          source: url ? new URL(url).hostname : "",
        });
        if (error) alert(`保存分享内容失败：${error.message}`);
        else { toast("分享内容已保存 ✓"); }
      })();
    } else if (sb) {
      sb.auth.getSession().then(({ data: { session } }) => { if (session) showMain(); });
    }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
