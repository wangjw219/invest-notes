<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>投资知识库 · 收藏列表</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    body { max-width: 640px; margin: 0 auto; padding: 16px; font: 15px/1.7 system-ui, sans-serif; }
    .hidden { display: none; }
    button { font: inherit; padding: 6px 12px; cursor: pointer; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #e8f0fe; color: #1a73e8; margin-right: 6px; }
    .badge.idea { background: #e6f4ea; color: #137333; }
    .badge.done { background: #f1f3f4; color: #5f6368; }
    .meta { color: #80868b; font-size: 12px; }
    .summary { white-space: pre-wrap; background: #f8f9fa; padding: 8px; border-radius: 6px; margin-top: 8px; }
    .original { display: none; white-space: pre-wrap; background: #fff; border: 1px dashed #dadce0; padding: 8px; border-radius: 6px; margin-top: 8px; font-size: 14px; max-height: 300px; overflow-y: auto; }
    .ext { font-size: 13px; margin: 4px 0 0; }
    .ext .cat { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: #fef7e0; color: #b06000; margin-right: 4px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .actions { margin-top: 8px; display: flex; gap: 8px; }
    .actions button { font-size: 13px; padding: 4px 10px; }
    .danger { color: #b3261e; border-color: #b3261e; background: #fff; }
    a { color: #1a73e8; word-break: break-all; }
    #tabs { display: flex; gap: 4px; margin: 12px 0; border-bottom: 1px solid #dadce0; overflow-x: auto; }
    #tabs button { border: none; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: #5f6368; white-space: nowrap; }
    #tabs button.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="row">
    <h3>收藏列表</h3>
    <div>
      <a href="./">← 保存</a>
      <a href="#" id="logout" class="hidden"> · 退出</a>
    </div>
  </div>

  <div id="tabs">
    <button data-tab="all" class="active">全部</button>
    <button data-tab="idea">我的想法</button>
    <button data-tab="viewpoint">其他人的观点</button>
    <button data-tab="daily">每日总结</button>
    <button data-tab="weekly">每周总结</button>
  </div>

  <div id="content"></div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const $ = (id) => document.getElementById(id);
    const cfg = {
      url: localStorage.getItem("sb_url") ?? "",
      anon: localStorage.getItem("sb_anon") ?? "",
    };
    if (!cfg.url || !cfg.anon) { location.href = "./"; }
    const sb = createClient(cfg.url, cfg.anon);
    const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = "./"; }
    else $("logout").classList.remove("hidden");

    $("logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await sb.auth.signOut();
      location.href = "./";
    });

    let items = [], digests = [], activeTab = "all";

    async function load() {
      const [r1, r2] = await Promise.all([
        sb.from("items")
          .select("id, type, title, url, content, excerpt, status, created_at, summaries(summary), extractions(category, rule_text)")
          .order("created_at", { ascending: false }).limit(200),
        sb.from("digests").select("*").order("digest_date", { ascending: false }).limit(60),
      ]);
      if (r1.error) { alert(r1.error.message); return; }
      items = r1.data ?? [];
      digests = r2.data ?? [];
      render();
    }

    function render() {
      const box = $("content");
      box.innerHTML = "";
      if (activeTab === "daily" || activeTab === "weekly") {
        const list = digests.filter((d) => d.kind === activeTab);
        box.innerHTML = list.length ? "" : `<p class="meta">${activeTab === "daily" ? "每日总结会在每天 23:30 自动生成。" : "每周总结会在每周日 23:35 自动生成。"}</p>`;
        for (const d of list) renderDigest(box, d);
        return;
      }
      const list = activeTab === "all" ? items : items.filter((i) => i.type === activeTab);
      box.innerHTML = list.length ? "" : '<p class="meta">这个分类还没有内容。</p>';
      for (const it of list) renderItem(box, it);
    }

    function renderDigest(box, d) {
      const el = document.createElement("div");
      el.className = "card";
      el.style.borderColor = d.kind === "weekly" ? "#7c3aed" : "#1a73e8";
      el.innerHTML = `
        <span class="badge">${d.kind === "weekly" ? "🗓 每周总结" : "📋 每日思路"} · ${d.digest_date}</span>
        <span class="meta">基于 ${d.item_count} 条收藏</span>
        <div class="summary" style="margin-top:8px">${escapeHtml(d.content)}</div>`;
      box.appendChild(el);
    }

    function renderItem(box, it) {
      const el = document.createElement("div");
      el.className = "card";
      const typeLabel = { idea: "我的想法", viewpoint: "其他人的观点", article: "文章" }[it.type] ?? it.type;
      const date = new Date(it.created_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const exts = (it.extractions ?? []).map((e) =>
        `<li class="ext"><span class="cat">${e.category}</span>${escapeHtml(e.rule_text)}</li>`).join("");
      const sums = (it.summaries ?? []).map((s) => `<div class="summary">${escapeHtml(s.summary)}</div>`).join("");
      el.innerHTML = `
        <span class="badge ${it.type === "idea" ? "idea" : ""}">${typeLabel}</span>
        ${it.status === "summarized" ? '<span class="badge done">已总结</span>' : ""}
        <span class="meta">${date}</span>
        <div>${it.url ? `<a href="${it.url}" target="_blank" rel="noopener">${escapeHtml(it.title || it.url)}</a>` : escapeHtml(it.title)}</div>
        <div class="actions" style="margin-top:4px">
          <button data-act="orig">原文 (${(it.content ?? "").length} 字)</button>
        </div>
        <div class="original" data-box="orig">${escapeHtml(it.content || "（无内容）")}</div>
        ${sums}
        <ul style="margin:0;padding:0;list-style:none">${exts}</ul>
        <div class="actions">
          ${it.status !== "summarized" ? '<button data-act="sum">AI 总结</button>' : ""}
          <button data-act="del" class="danger">删除</button>
        </div>`;
      el.querySelector('[data-act="orig"]').addEventListener("click", (e) => {
        const obox = el.querySelector('[data-box="orig"]');
        const show = obox.style.display !== "block";
        obox.style.display = show ? "block" : "none";
        e.target.textContent = e.target.textContent.replace(show ? "原文" : "收起", show ? "收起" : "原文");
      });
      el.querySelector('[data-act="del"]').addEventListener("click", async () => {
        if (!confirm("确定删除这条收藏？（连带总结和规则一起删除）")) return;
        const { error } = await sb.from("items").delete().eq("id", it.id);
        if (error) alert(`删除失败：${error.message}`);
        el.remove();
      });
      el.querySelector('[data-act="sum"]')?.addEventListener("click", async (e) => {
        e.target.disabled = true; e.target.textContent = "总结中…";
        try {
          const { data: { session } } = await sb.auth.getSession();
          const resp = await fetch(`${cfg.url}/functions/v1/summarize`, {
            method: "POST",
            headers: { Authorization: `Bearer ${session.access_token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ itemId: it.id }),
          });
          const result = await resp.json();
          if (!resp.ok) alert(`总结失败：${result.error ?? resp.status}`);
          load();
        } catch (err) { alert(`出错了：${err.message ?? err}`); e.target.disabled = false; e.target.textContent = "AI 总结"; }
      });
      box.appendChild(el);
    }

    document.querySelectorAll("#tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        render();
      });
    });

    load();
  </script>
</body>
</html>
