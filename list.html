<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2f4ef" />
  <title>投资知识库 · 收藏列表</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1 class="wordmark">收藏列表</h1>
      <nav class="nav">
        <a href="./" class="nav-link">保存</a>
        <a href="#" id="logout" class="nav-link hidden">退出</a>
      </nav>
    </header>

    <div id="tabs" class="tabs" role="tablist">
      <button class="tab active" data-kind="all" role="tab" aria-selected="true">全部<span class="count"></span></button>
      <button class="tab" data-kind="idea" role="tab" aria-selected="false">我的想法<span class="count"></span></button>
      <button class="tab" data-kind="viewpoint" role="tab" aria-selected="false">其他人的观点<span class="count"></span></button>
      <button class="tab" data-kind="daily" role="tab" aria-selected="false">每日总结<span class="count"></span></button>
      <button class="tab" data-kind="weekly" role="tab" aria-selected="false">每周总结<span class="count"></span></button>
      <button class="tab" data-kind="x-invest" role="tab" aria-selected="false">X 机会<span class="count"></span></button>
      <button class="tab" data-kind="xueqiu" role="tab" aria-selected="false">雪球日报<span class="count"></span></button>
    </div>

    <div id="content" class="list"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const $ = (id) => document.getElementById(id);
    const cfg = {
      url: localStorage.getItem("sb_url") ?? "https://oraddrhfysrqdflatgzn.supabase.co",
      anon: localStorage.getItem("sb_anon") ?? "sb_publishable_Buf1sJtQUaTwLwNm-PWyTA_e0xCh21S",
    };
    const sb = createClient(cfg.url, cfg.anon);
    const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // digest 各类型的展示元数据；key 与 digests.kind 对应
    const DIGESTS = {
      daily: { label: "每日总结", empty: "每日总结会在每天 23:30 自动生成。" },
      weekly: { label: "每周总结", empty: "每周总结会在每周日 23:35 自动生成。" },
      "x-invest": { label: "X 机会", empty: "X 投资机会日报由本机定时任务生成、Telegram 投递后归档到这里。" },
      xueqiu: { label: "雪球日报", empty: "雪球投资日报由本机定时任务生成、Telegram 投递后归档到这里。" },
    };
    const TYPE_LABELS = { idea: "我的想法", viewpoint: "其他人的观点", article: "文章" };

    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = "./"; }
    else $("logout").classList.remove("hidden");

    $("logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await sb.auth.signOut();
      location.href = "./";
    });

    let items = [], digests = [], activeTab = "all";

    async function load() {
      const [r1, r2] = await Promise.all([
        sb.from("items")
          .select("id, type, title, url, content, excerpt, status, created_at, summaries(summary), extractions(category, rule_text)")
          .order("created_at", { ascending: false }).limit(200),
        sb.from("digests").select("*").order("digest_date", { ascending: false }).limit(60),
      ]);
      if (r1.error) { alert(r1.error.message); return; }
      items = r1.data ?? [];
      digests = r2.data ?? [];
      updateCounts();
      render();
    }

    function updateCounts() {
      const counts = { all: items.length };
      for (const kind of Object.keys(DIGESTS)) {
        counts[kind] = digests.filter((d) => d.kind === kind).length;
      }
      for (const it of items) counts[it.type] = (counts[it.type] ?? 0) + 1;
      document.querySelectorAll("#tabs button").forEach((btn) => {
        const n = counts[btn.dataset.kind] ?? 0;
        btn.querySelector(".count").textContent = n ? String(n) : "";
      });
    }

    function render() {
      const box = $("content");
      box.innerHTML = "";
      if (DIGESTS[activeTab]) {
        const list = digests.filter((d) => d.kind === activeTab);
        if (!list.length) { box.innerHTML = `<p class="empty">${DIGESTS[activeTab].empty}</p>`; return; }
        for (const d of list) renderDigest(box, d);
        return;
      }
      const list = activeTab === "all" ? items : items.filter((i) => i.type === activeTab);
      if (!list.length) {
        box.innerHTML = '<p class="empty">这个分类还没有内容。<a href="./">去保存页记下第一条</a>。</p>';
        return;
      }
      for (const it of list) renderItem(box, it);
    }

    function renderDigest(box, d) {
      const meta = DIGESTS[d.kind] ?? { label: d.kind };
      const el = document.createElement("article");
      el.className = "entry";
      el.dataset.kind = d.kind;
      el.innerHTML = `
        <div class="entry-rail">
          <span class="entry-kind">${meta.label}</span>
          <span class="entry-date">${d.digest_date}</span>
        </div>
        <div class="entry-body">
          ${d.item_count ? `<p class="meta">基于 ${d.item_count} 条收藏</p>` : ""}
          <div class="digest-body">${escapeHtml(d.content)}</div>
        </div>`;
      box.appendChild(el);
    }

    function renderItem(box, it) {
      const el = document.createElement("article");
      el.className = "entry";
      el.dataset.kind = it.type;
      const typeLabel = TYPE_LABELS[it.type] ?? it.type;
      const date = new Date(it.created_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const exts = (it.extractions ?? []).map((e) =>
        `<li class="rule"><span class="cat">${escapeHtml(e.category ?? "")}</span>${escapeHtml(e.rule_text)}</li>`).join("");
      const sums = (it.summaries ?? []).map((s) => `<div class="summary">${escapeHtml(s.summary)}</div>`).join("");
      el.innerHTML = `
        <div class="entry-rail">
          <span class="entry-kind">${typeLabel}</span>
          <span class="entry-date">${date}</span>
          ${it.status === "summarized" ? '<span class="entry-status">已总结</span>' : ""}
        </div>
        <div class="entry-body">
          <h3 class="entry-title">${it.url
            ? `<a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.title || it.url)}</a>`
            : escapeHtml(it.title ?? "")}</h3>
          ${sums}
          ${exts ? `<ul class="rules">${exts}</ul>` : ""}
          <div class="entry-actions">
            <button class="text-btn" data-act="orig">原文 (${(it.content ?? "").length} 字)</button>
            ${it.status !== "summarized" ? '<button class="text-btn" data-act="sum">AI 总结</button>' : ""}
            <button class="text-btn danger" data-act="del">删除</button>
          </div>
          <div class="original" data-box="orig">${escapeHtml(it.content || "（无内容）")}</div>
        </div>`;
      el.querySelector('[data-act="orig"]').addEventListener("click", (e) => {
        const obox = el.querySelector('[data-box="orig"]');
        const show = obox.style.display !== "block";
        obox.style.display = show ? "block" : "none";
        e.target.textContent = e.target.textContent.replace(show ? "原文" : "收起", show ? "收起" : "原文");
      });
      el.querySelector('[data-act="del"]').addEventListener("click", async () => {
        if (!confirm("确定删除这条收藏？（连带总结和规则一起删除）")) return;
        const { error } = await sb.from("items").delete().eq("id", it.id);
        if (error) { alert(`删除失败：${error.message}`); return; }
        items = items.filter((i) => i.id !== it.id);
        el.remove();
        updateCounts();
      });
      el.querySelector('[data-act="sum"]')?.addEventListener("click", async (e) => {
        e.target.disabled = true; e.target.textContent = "总结中…";
        try {
          const { data: { session } } = await sb.auth.getSession();
          const resp = await fetch(`${cfg.url}/functions/v1/summarize`, {
            method: "POST",
            headers: { Authorization: `Bearer ${session.access_token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ itemId: it.id }),
          });
          const result = await resp.json();
          if (!resp.ok) alert(`总结失败：${result.error ?? resp.status}`);
          load();
        } catch (err) { alert(`出错了：${err.message ?? err}`); e.target.disabled = false; e.target.textContent = "AI 总结"; }
      });
      box.appendChild(el);
    }

    document.querySelectorAll("#tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#tabs button").forEach((b) => {
          b.classList.remove("active");
          b.setAttribute("aria-selected", "false");
        });
        btn.classList.add("active");
        btn.setAttribute("aria-selected", "true");
        activeTab = btn.dataset.kind;
        render();
      });
    });

    load();
  </script>
</body>
</html>
